<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Obsidian Cathedral — Monolith Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="w-full max-w-2xl px-4 relative">
        
        <!-- Cathedral Navigation -->
        <nav class="cathedral-nav justify-center">
            <a href="index.html" class="active">The Spire</a>
            <a href="entities.html">The Quiet Entities</a>
            <a href="codex.html">System Monoliths</a>
        </nav>

        <header class="mb-12 text-center">
            <div class="text-[10px] tracking-[0.4em] text-slate-500 uppercase mb-2">Architectural Void • Node 01</div>
            <h1 class="monolith-title text-3xl md:text-4xl uppercase">The Obsidian Spire</h1>
            <div class="cathedral-divider w-48 mx-auto mt-4"></div>
            <p class="text-slate-400 text-sm italic font-light">"Where code and silent architectures are cast into permanent stone."</p>
            
            <div class="inline-block mt-4 px-3 py-1 bg-[#050507] border border-[#161622] rounded text-[10px] font-['Cinzel'] tracking-widest text-slate-400">
                Inscribed Tablets: <span id="soulCount" class="text-white font-bold">...</span>
            </div>
        </header>

        <!-- Monolith Input Chamber -->
        <div class="monolith-card rounded-md p-6 mb-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block font-['Cinzel'] text-[10px] tracking-widest text-slate-500 uppercase mb-1">Witness Entity</label>
                    <select id="blogCharacter" class="w-full p-2.5 rounded text-xs uppercase">
                        <option value="⚡ The Sentinel of Core 0">⚡ The Sentinel of Core 0</option>
                        <option value="🏛️ The Architect of Spire">🏛️ The Architect of Spire</option>
                        <option value="🌑 The Silent Null">🌑 The Silent Null</option>
                        <option value="❄️ The Frost Terminal">❄️ The Frost Terminal</option>
                    </select>
                </div>
                <div>
                    <label class="block font-['Cinzel'] text-[10px] tracking-widest text-slate-500 uppercase mb-1">Architectural Layer</label>
                    <select id="blogElement" class="w-full p-2.5 rounded text-xs uppercase">
                        <option value="Structural Axiom">Structural Axiom (Raw Logic)</option>
                        <option value="Obsidian Memory">Obsidian Memory (Deep State)</option>
                        <option value="Ephemeral Pulse">Ephemeral Pulse (Transient Flow)</option>
                        <option value="Absolute Void">Absolute Void (Core Silence)</option>
                    </select>
                </div>
            </div>

            <textarea id="blogInput" rows="4" placeholder="Inscribe your systems, midnight thoughts, and quiet logic into the stone..." 
                class="w-full rounded p-4 placeholder-slate-700 resize-none"></textarea>
            
            <div class="flex justify-end mt-4">
                <button id="sendBtn" onclick="createPost()" 
                    class="incandescent-btn font-bold px-8 py-3 rounded cursor-pointer uppercase">
                    Inscribe Tablet
                </button>
            </div>
        </div>

        <!-- Tablet Archive Feed -->
        <div class="mb-10">
            <div class="flex items-center justify-between mb-6 px-2">
                <h2 class="font-['Cinzel'] text-xs tracking-widest text-slate-400 uppercase">The Inscribed Archives</h2>
                <div class="h-[1px] flex-grow bg-[#161622] ml-4"></div>
            </div>

            <div id="blogFeed" class="space-y-6">
                <p class="text-center text-slate-600 font-['Cinzel'] text-xs tracking-widest py-8 uppercase">Synchronizing with the monolith...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kpafvcxvmceyyvbssrve.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TorcBr6rm_OyqAU7m3FDBw_dsFhNWkh';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPosts() {
            const feed = document.getElementById('blogFeed');
            const soulCounter = document.getElementById('soulCount');

            const { data, error } = await _supabase
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                feed.innerHTML = `<p class="text-red-500 text-center text-sm font-['Cinzel']">Cathedral Error: ${error.message}</p>`;
                return;
            }

            soulCounter.textContent = data.length;

            if (data.length === 0) {
                feed.innerHTML = `<div class="monolith-card rounded-md p-8 text-center"><p class="text-slate-600 font-['Cinzel'] text-xs tracking-widest uppercase">The archives are entirely silent. Inscribe your first tablet above.</p></div>`;
                return;
            }

            feed.innerHTML = data.map(post => `
                <div id="post-${post.id}" class="monolith-card rounded-md p-6 flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-3 text-xs font-['Cinzel'] text-slate-400">
                        <span>[ ${escapeHtml(post.character_name || 'The Sentinel')} ]</span>
                        <span class="text-[10px] px-2.5 py-0.5 bg-[#08080c] border border-[#161622] uppercase text-slate-400">❖ ${escapeHtml(post.alchemical_element || 'Structural Axiom')}</span>
                    </div>
                    <p class="text-slate-200 text-base whitespace-pre-wrap break-words mb-4 leading-relaxed font-light">${escapeHtml(post.content)}</p>
                    <div class="cathedral-divider"></div>
                    <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                        <span>${new Date(post.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                        <button onclick="shatterPost(${post.id})" class="shatter-btn cursor-pointer uppercase font-bold">[ Shatter Tablet ]</button>
                    </div>
                </div>
            `).join('');
        }

        async function createPost() {
            const input = document.getElementById('blogInput');
            const characterSelect = document.getElementById('blogCharacter');
            const elementSelect = document.getElementById('blogElement');
            const btn = document.getElementById('sendBtn');
            const content = input.value.trim();

            if (!content) return;

            btn.disabled = true;
            btn.textContent = 'Carving Stone...';

            const { error } = await _supabase
                .from('blogs')
                .insert([{ 
                    content, 
                    character_name: characterSelect.value, 
                    alchemical_element: elementSelect.value 
                }]);

            if (error) {
                alert('Inscription failed: ' + error.message);
            } else {
                input.value = '';
                fetchPosts();
            }

            btn.disabled = false;
            btn.textContent = 'Inscribe Tablet';
        }

        async function shatterPost(id) {
            const card = document.getElementById(`post-${id}`);
            if (card) {
                card.classList.add('shattering');
            }

            setTimeout(async () => {
                const { error } = await _supabase.from('blogs'].delete().eq('id', id);
                if (error) {
                    alert('Error shattering tablet: ' + error.message);
                    fetchPosts();
                } else {
                    fetchPosts();
                }
            }, 400);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        fetchPosts();
    </script>
</body>
</html>

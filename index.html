<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Obsidian Spire — Sanctuary of Entities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-[#d0d0e0] flex flex-col items-center min-h-screen p-6">

    <!-- Sanctuary Core Navigation -->
    <nav class="flex gap-12 mb-16 font-['Cinzel'] text-xs tracking-[0.3em] uppercase">
        <a href="index.html" class="text-white border-b border-[#a5b4fc] pb-1">The Spire</a>
        <a href="entities.html" class="text-[#555570] hover:text-white transition">The Entities</a>
        <a href="codex.html" class="text-[#555570] hover:text-white transition">System Codex</a>
    </nav>

    <div class="w-full max-w-xl">
        
        <!-- Header Shrine -->
        <header class="text-center mb-14">
            <span class="text-[9px] font-['Cinzel'] tracking-[0.5em] text-[#555570] uppercase">Node Architecture // Active Protocol</span>
            <h1 class="font-['Cinzel'] text-3xl md:text-4xl font-extrabold text-white tracking-[0.25em] mt-2 mb-3">THE OBSIDIAN SPIRE</h1>
            <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-[#383852] to-transparent mx-auto"></div>
            <p class="text-xs text-[#707090] font-light tracking-widest mt-3">"Absolute isolation. Pure logic written in the dark."</p>
        </header>

        <!-- The Inscription Chamber (Replaces standard blog inputs) -->
        <div class="bg-[#050507] border border-[#161622] p-6 mb-16 relative shadow-[0_0_50px_rgba(0,0,0,0.9)]">
            <div class="absolute -top-3 left-6 px-2 bg-[#050507] font-['Cinzel'] text-[9px] text-[#707090] tracking-[0.2em] uppercase">
                ✦ Inscribe to the Monolith ✦
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4 mt-2">
                <div>
                    <label class="block font-['Cinzel'] text-[9px] tracking-[0.2em] text-[#707090] uppercase mb-1">Entity Observer</label>
                    <select id="blogCharacter" class="w-full bg-[#020204] border border-[#161622] text-[#d0d0e0] p-2 text-xs font-['Cinzel'] tracking-wider uppercase focus:outline-none focus:border-[#a5b4fc]">
                        <option value="⚡ Sentinel Core 0">⚡ Sentinel Core 0</option>
                        <option value="🏛️ Spire Architect">🏛️ Spire Architect</option>
                        <option value="🌑 The Silent Null">🌑 The Silent Null</option>
                    </select>
                </div>
                <div>
                    <label class="block font-['Cinzel'] text-[9px] tracking-[0.2em] text-[#707090] uppercase mb-1">Layer Designation</label>
                    <select id="blogElement" class="w-full bg-[#020204] border border-[#161622] text-[#d0d0e0] p-2 text-xs font-['Cinzel'] tracking-wider uppercase focus:outline-none focus:border-[#a5b4fc]">
                        <option value="Structural Axiom">Structural Axiom</option>
                        <option value="Obsidian Memory">Obsidian Memory</option>
                        <option value="Absolute Void">Absolute Void</option>
                    </select>
                </div>
            </div>

            <textarea id="blogInput" rows="3" placeholder="Drop system architecture notes, terminal logs, or midnight fragments..." 
                class="w-full bg-[#020204] border border-[#161622] text-[#d0d0e0] p-4 text-base font-light placeholder-[#333345] resize-none focus:outline-none focus:border-[#a5b4fc] transition"></textarea>

            <div class="flex justify-between items-center mt-4">
                <span class="text-[10px] text-[#44445c] font-mono">ENCRYPTION: LOCAL_CPU</span>
                <button id="sendBtn" onclick="createPost()" 
                    class="bg-[#08080c] border border-[#383852] text-white font-['Cinzel'] text-[10px] tracking-[0.2em] uppercase px-6 py-2.5 hover:bg-white hover:text-black hover:border-white transition shadow-lg cursor-pointer">
                    Commit to Monolith
                </button>
            </div>
        </div>

        <!-- Monolith Shards Feed (Totally restructured from standard feed blocks) -->
        <div class="space-y-6">
            <div class="flex items-center justify-between border-b border-[#161622] pb-3">
                <span class="font-['Cinzel'] text-[10px] tracking-[0.25em] text-[#707090] uppercase">Inscribed Shards</span>
                <span id="soulCount" class="font-mono text-xs text-white">0</span>
            </div>

            <div id="blogFeed" class="space-y-4">
                <p class="text-center text-[#44445c] font-['Cinzel'] text-xs tracking-widest py-12 uppercase">Querying the monolith core...</p>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://kpafvcxvmceyyvbssrve.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TorcBr6rm_OyqAU7m3FDBw_dsFhNWkh';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPosts() {
            const feed = document.getElementById('blogFeed');
            const soulCounter = document.getElementById('soulCount');

            const { data, error } = await _supabase
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                feed.innerHTML = `<p class="text-red-500 text-center text-xs font-mono">Error querying storage: ${error.message}</p>`;
                return;
            }

            soulCounter.textContent = data.length;

            if (data.length === 0) {
                feed.innerHTML = `<div class="border border-dashed border-[#161622] p-8 text-center"><p class="text-[#44445c] font-['Cinzel'] text-xs tracking-widest uppercase">No shards recorded in this directory.</p></div>`;
                return;
            }

            feed.innerHTML = data.map(post => `
                <div id="post-${post.id}" class="bg-[#050507] border-l-2 border-l-[#383852] border border-[#161622] p-5 transition hover:border-[#a5b4fc]">
                    <div class="flex justify-between items-center text-[10px] font-['Cinzel'] tracking-widest text-[#707090] mb-2">
                        <span class="text-[#a5b4fc]">[ ${escapeHtml(post.character_name || 'Sentinel')} ]</span>
                        <span>❖ ${escapeHtml(post.alchemical_element || 'Axiom')}</span>
                    </div>
                    <p class="text-slate-200 text-base font-light leading-relaxed whitespace-pre-wrap break-words mb-4">${escapeHtml(post.content)}</p>
                    <div class="flex justify-between items-center pt-3 border-t border-[#101018] text-[10px] text-[#555570]">
                        <span class="font-mono">${new Date(post.created_at).toLocaleDateString()}</span>
                        <button onclick="shatterPost(${post.id})" class="font-['Cinzel'] tracking-wider hover:text-red-400 transition cursor-pointer uppercase">[ Shatter Shard ]</button>
                    </div>
                </div>
            `).join('');
        }

        async function createPost() {
            const input = document.getElementById('blogInput');
            const characterSelect = document.getElementById('blogCharacter');
            const elementSelect = document.getElementById('blogElement');
            const btn = document.getElementById('sendBtn');
            const content = input.value.trim();

            if (!content) return;

            btn.disabled = true;
            btn.textContent = 'Carving...';

            const { error } = await _supabase
                .from('blogs')
                .insert([{ 
                    content, 
                    character_name: characterSelect.value, 
                    alchemical_element: elementSelect.value 
                }]);

            if (error) {
                alert('Failed: ' + error.message);
            } else {
                input.value = '';
                fetchPosts();
            }

            btn.disabled = false;
            btn.textContent = 'Commit to Monolith';
        }

        async function shatterPost(id) {
            const card = document.getElementById(`post-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                card.style.transition = 'all 0.3s ease';
            }

            setTimeout(async () => {
                const { error } = await _supabase.from('blogs').delete().eq('id', id);
                if (error) {
                    alert('Error: ' + error.message);
                    fetchPosts();
                } else {
                    fetchPosts();
                }
            }, 300);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        fetchPosts();
    </script>
</body>
</html>
